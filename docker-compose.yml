# Local research development only. Never use these credentials with real data or in production.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medtwinx
      MYSQL_USER: medtwinx
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medtwinx_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medtwinx_root_local_only}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: ./services/ai
    command: ["uvicorn", "medtwin_ai.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./medtwin-x
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8080
      APP_KEY: ${APP_KEY:?Set APP_KEY in medtwin-x/.env before starting Compose}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: medtwinx
      DB_USERNAME: medtwinx
      DB_PASSWORD: ${MYSQL_PASSWORD:-medtwinx_local_only}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDTWIN_AI_URL: http://ai:8001
    command: ["sh", "-c", "php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8000"]
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "try { file_get_contents('http://127.0.0.1:8000/up'); exit(0); } catch (Throwable $e) { exit(1); }"]
      interval: 5s
      timeout: 3s
      retries: 30

  queue:
    build:
      context: ./medtwin-x
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:?Set APP_KEY in medtwin-x/.env before starting Compose}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: medtwinx
      DB_USERNAME: medtwinx
      DB_PASSWORD: ${MYSQL_PASSWORD:-medtwinx_local_only}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDTWIN_AI_URL: http://ai:8001
    command: ["php", "artisan", "queue:work", "--tries=1"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data: